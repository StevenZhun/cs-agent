<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-topology-title runtime-topology-desc" id="runtime-topology-root">
      <title id="runtime-topology-title">智能客服系统运行拓扑</title>
      <desc id="runtime-topology-desc">展示浏览器经 Nginx 和 BFF 进入 AI Runtime 的主请求链，以及业务服务、恢复进程、质量服务、状态存储和模型供应商之间的调用关系。</desc>
      <defs>
      <style>#runtime-topology-root { --paper: #f5f5f5;
      --surface: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: #dadce2;
      --accent: #bf4520;
      --accent-dark: #943519;
      --accent-tint: #f8ece8;
      --link: #2e5aa8;
      --link-tint: #eef3fb;
      --async: #536f5a;
      --async-tint: #eff5f0;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      #runtime-topology-root { color: var(--ink); font-family: var(--font-sans); }
      #runtime-topology-root .diagram-container { width: 100%; overflow-x: auto; }
      #runtime-topology-root .title { font: 700 26px var(--font-sans); fill: #ffffff; }
      #runtime-topology-root .subtitle { font: 500 13px var(--font-sans); fill: #dbe7ff; }
      #runtime-topology-root .zone-name { font: 700 13px var(--font-sans); fill: #52627a; }
      #runtime-topology-root .zone-note { font: 400 10px var(--font-sans); fill: #8491a6; }
      #runtime-topology-root .node-name { font: 700 16px var(--font-sans); fill: var(--ink); }
      #runtime-topology-root .node-note { font: 400 11px var(--font-sans); fill: var(--muted); }
      #runtime-topology-root .node-tech { font: 500 10px var(--font-mono); fill: var(--soft); }
      #runtime-topology-root .focal-name { font: 700 17px var(--font-sans); fill: #943519; }
      #runtime-topology-root .focal-note { font: 400 11px var(--font-sans); fill: #76564c; }
      #runtime-topology-root .chip { font: 500 10px var(--font-sans); fill: #304d7d; }
      #runtime-topology-root .edge-label { font: 500 9px var(--font-mono); fill: #5a6580; letter-spacing: .04em; }
      #runtime-topology-root .diagram-container { overflow-x: visible; }</style>
        <linearGradient id="runtime-topology-runtime-header-gradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2d3142"/>
          <stop offset="1" stop-color="#4f5d75"/>
        </linearGradient>
        <marker id="runtime-topology-runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d879a"/>
        </marker>
        <marker id="runtime-topology-runtime-arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e5aa8"/>
        </marker>
        <marker id="runtime-topology-runtime-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#536f5a"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>
      <rect x="24" y="20" width="1232" height="64" rx="8" fill="url(#runtime-topology-runtime-header-gradient)"/>
      <text class="title" x="48" y="58">智能客服系统 · 运行拓扑</text>
      <text class="subtitle" x="1232" y="57" text-anchor="end">主请求链 + 业务依赖 + 恢复与质量旁路</text>

      <!-- Quiet zones establish responsibility without pretending every zone is a process. -->
      <rect x="24" y="108" width="260" height="516" rx="8" fill="#ffffff" stroke="#dadce2"/>
      <text class="zone-name" x="44" y="134">使用入口</text>
      <text class="zone-note" x="44" y="151">客户与坐席共享统一 HTTPS 入口</text>

      <rect x="304" y="108" width="600" height="516" rx="8" fill="#ffffff" stroke="#dadce2"/>
      <text class="zone-name" x="324" y="134">应用服务</text>
      <text class="zone-note" x="324" y="151">同步受理、AI 编排、业务查询、恢复与质量记录</text>

      <rect x="924" y="108" width="332" height="516" rx="8" fill="#ffffff" stroke="#dadce2"/>
      <text class="zone-name" x="944" y="134">运行依赖</text>
      <text class="zone-note" x="944" y="151">权威事实、发布投影、向量索引与外部模型能力</text>

      <!-- Connectors are intentionally drawn before nodes. -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Primary request path. -->
        <path d="M154 240 V320" stroke="#2e5aa8" stroke-width="2" marker-end="url(#runtime-topology-runtime-arrow-primary)"/>
        <path d="M252 356 H288 Q296 356 296 348 V212 Q296 204 304 204 H340" stroke="#2e5aa8" stroke-width="2" marker-end="url(#runtime-topology-runtime-arrow-primary)"/>
        <path d="M560 204 H648" stroke="#2e5aa8" stroke-width="2" marker-end="url(#runtime-topology-runtime-arrow-primary)"/>

        <!-- BFF and AI Runtime share the authoritative business service. -->
        <path d="M500 240 V280 Q500 288 508 288 H558 Q566 288 566 296 V336" stroke="#7d879a" stroke-width="1.5" marker-end="url(#runtime-topology-runtime-arrow)"/>
        <path d="M716 240 V296 Q716 304 708 304 H650 Q642 304 642 312 V336" stroke="#7d879a" stroke-width="1.5" marker-end="url(#runtime-topology-runtime-arrow)"/>

        <!-- State and projection access. -->
        <path d="M520 240 V256 Q520 264 528 264 H924 Q932 264 932 272 V284 Q932 292 940 292 H956" stroke="#7d879a" stroke-width="1.4" marker-end="url(#runtime-topology-runtime-arrow)"/>
        <path d="M868 184 H940 Q948 184 948 192 V312 Q948 320 956 320" stroke="#7d879a" stroke-width="1.5" marker-end="url(#runtime-topology-runtime-arrow)"/>

        <!-- Model calls and asynchronous quality recording. -->
        <path d="M868 216 H916 Q920 216 920 224 V480 Q920 488 928 488 H956" stroke="#7d879a" stroke-width="1.5" marker-end="url(#runtime-topology-runtime-arrow)"/>
        <path d="M758 240 V488" stroke="#536f5a" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#runtime-topology-runtime-arrow-async)"/>

        <!-- Recovery is passive until an interrupted or unknown-result run is found. -->
        <path d="M340 524 H324 Q316 524 316 516 V212 Q316 204 324 204 H340" stroke="#536f5a" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#runtime-topology-runtime-arrow-async)"/>
        <path d="M450 488 V448 H884 Q892 448 892 440 V212 Q892 204 884 204 H868" stroke="#536f5a" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#runtime-topology-runtime-arrow-async)"/>
      </g>

      <!-- Opaque label masks keep edge labels separate from their strokes. -->
      <g>
        <rect x="118" y="270" width="72" height="20" rx="4" fill="#f5f5f5"/>
        <text class="edge-label" x="154" y="284" text-anchor="middle">HTTPS</text>
        <rect x="272" y="260" width="50" height="20" rx="4" fill="#f5f5f5"/>
        <text class="edge-label" x="297" y="274" text-anchor="middle">API / SSE</text>
        <rect x="582" y="194" width="44" height="20" rx="4" fill="#f5f5f5"/>
        <text class="edge-label" x="604" y="208" text-anchor="middle">RUN</text>
        <rect x="726" y="352" width="64" height="20" rx="4" fill="#f5f5f5"/>
        <text class="edge-label" x="758" y="366" text-anchor="middle">ASYNC</text>
      </g>

      <!-- Entry nodes. -->
      <rect x="56" y="168" width="196" height="72" rx="8" fill="#eef3fb" stroke="#9fb3d4" stroke-width="1.2"/>
      <text class="node-name" x="154" y="196" text-anchor="middle">客户 / 坐席浏览器</text>
      <text class="node-note" x="154" y="217" text-anchor="middle">咨询、审核与实时消息</text>

      <rect x="56" y="320" width="196" height="72" rx="8" fill="#ffffff" stroke="#9fb3d4" stroke-width="1.2"/>
      <text class="node-name" x="154" y="348" text-anchor="middle">Nginx</text>
      <text class="node-note" x="154" y="369" text-anchor="middle">TLS、静态资源与反向代理</text>

      <!-- Application nodes. -->
      <rect x="340" y="168" width="220" height="72" rx="8" fill="#eef3fb" stroke="#9fb3d4" stroke-width="1.2"/>
      <text class="node-name" x="450" y="196" text-anchor="middle">BFF</text>
      <text class="node-note" x="450" y="217" text-anchor="middle">鉴权、幂等、消息、SSE 与输出门</text>

      <rect x="648" y="168" width="220" height="72" rx="8" fill="#f8ece8" stroke="#bf4520" stroke-width="1.5"/>
      <text class="focal-name" x="758" y="196" text-anchor="middle">AI Runtime</text>
      <text class="focal-note" x="758" y="217" text-anchor="middle">LangGraph · 路由 / FAQ / SOP / RAG</text>

      <rect x="494" y="336" width="220" height="72" rx="8" fill="#ffffff" stroke="#c8d4e5"/>
      <text class="node-name" x="604" y="364" text-anchor="middle">Customer Data</text>
      <text class="node-note" x="604" y="385" text-anchor="middle">客户资料、服务记录与受控业务接口</text>

      <rect x="340" y="488" width="220" height="72" rx="8" fill="#eff5f0" stroke="#9ab09e"/>
      <text class="node-name" x="450" y="516" text-anchor="middle">BFF Recovery</text>
      <text class="node-note" x="450" y="537" text-anchor="middle">恢复中断或结果未知的运行</text>

      <rect x="648" y="488" width="220" height="72" rx="8" fill="#eff5f0" stroke="#9ab09e"/>
      <text class="node-name" x="758" y="516" text-anchor="middle">Quality</text>
      <text class="node-note" x="758" y="537" text-anchor="middle">异步质量记录与分析，不参与同步放行</text>

      <!-- Dependency nodes collapse leaf clusters without hiding their members. -->
      <rect x="956" y="260" width="268" height="104" rx="8" fill="#ffffff" stroke="#aab8ca" stroke-width="1.2"/>
      <text class="node-name" x="976" y="288">状态与知识存储</text>
      <text class="node-note" x="976" y="307">应用事实、活动投影与可重建索引</text>
      <rect x="976" y="324" width="72" height="22" rx="6" fill="#eef3fb" stroke="#b4c3dd"/>
      <text class="chip" x="1012" y="339" text-anchor="middle">PostgreSQL</text>
      <rect x="1056" y="324" width="64" height="22" rx="6" fill="#eef3fb" stroke="#b4c3dd"/>
      <text class="chip" x="1088" y="339" text-anchor="middle">Redis</text>
      <rect x="1128" y="324" width="72" height="22" rx="6" fill="#eef3fb" stroke="#b4c3dd"/>
      <text class="chip" x="1164" y="339" text-anchor="middle">Milvus</text>

      <rect x="956" y="436" width="268" height="104" rx="8" fill="#ffffff" stroke="#aab8ca" stroke-width="1.2"/>
      <text class="node-name" x="976" y="464">模型与决策供应商</text>
      <text class="node-note" x="976" y="483">主链模型调用与可选 Jev 旁路观测</text>
      <rect x="976" y="500" width="54" height="22" rx="6" fill="#eef3fb" stroke="#b4c3dd"/>
      <text class="chip" x="1003" y="515" text-anchor="middle">LLM</text>
      <rect x="1038" y="500" width="80" height="22" rx="6" fill="#eef3fb" stroke="#b4c3dd"/>
      <text class="chip" x="1078" y="515" text-anchor="middle">Embedding</text>
      <rect x="1126" y="500" width="76" height="22" rx="6" fill="#eef3fb" stroke="#b4c3dd"/>
      <text class="chip" x="1164" y="515" text-anchor="middle">Rerank / Jev</text>

      <!-- Legend and reading guide. -->
      <line x1="24" y1="652" x2="1256" y2="652" stroke="#dadce2"/>
      <line x1="48" y1="678" x2="82" y2="678" stroke="#2e5aa8" stroke-width="2" marker-end="url(#runtime-topology-runtime-arrow-primary)"/>
      <text class="footer" x="94" y="682">客户同步主链路</text>
      <line x1="230" y1="678" x2="264" y2="678" stroke="#7d879a" stroke-width="1.5" marker-end="url(#runtime-topology-runtime-arrow)"/>
      <text class="footer" x="276" y="682">业务或数据依赖</text>
      <line x1="430" y1="678" x2="464" y2="678" stroke="#536f5a" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#runtime-topology-runtime-arrow-async)"/>
      <text class="footer" x="476" y="682">异步、被动或恢复路径</text>
      <text class="footer" x="1232" y="682" text-anchor="end">内容发布能力折叠在应用与存储职责中，并非独立常驻服务</text>
    </svg>
