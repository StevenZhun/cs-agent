<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-layers-title architecture-layers-desc" id="architecture-layers-root">
      <title id="architecture-layers-title">智能客服系统分层架构</title>
      <desc id="architecture-layers-desc">展示客户消息从交互层进入数据与恢复层的七层主链路，以及同时约束各层的安全、审计、超时和恢复机制。</desc>
      <defs>
      <style>#architecture-layers-root { --paper: #f5f5f5;
      --surface: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: #dadce2;
      --harness: #536f5a;
      --harness-tint: #f1f5ef;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      #architecture-layers-root { color: var(--ink); font-family: var(--font-sans); }
      #architecture-layers-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-layers-root .title { font-family: var(--font-sans); font-size: 26px; font-weight: 700; fill: #ffffff; }
      #architecture-layers-root .subtitle { font-family: var(--font-sans); font-size: 13px; font-weight: 500; fill: #dbe7ff; }
      #architecture-layers-root .layer-name { font-family: var(--font-sans); font-size: 17px; font-weight: 700; fill: #ffffff; }
      #architecture-layers-root .layer-tech { font-family: var(--font-mono); font-size: 10px; font-weight: 500; fill: #e9efff; }
      #architecture-layers-root .row-title { font-family: var(--font-sans); font-size: 16px; font-weight: 700; fill: var(--ink); }
      #architecture-layers-root .code-path { font-family: var(--font-mono); font-size: 10px; fill: var(--soft); }
      #architecture-layers-root .chip-text { font-family: var(--font-sans); font-size: 10px; font-weight: 500; fill: currentColor; }
      #architecture-layers-root .focal-chip-text { font-family: var(--font-sans); font-size: 10px; font-weight: 500; fill: currentColor; }
      #architecture-layers-root .h-title { font-family: var(--font-sans); font-size: 18px; font-weight: 700; fill: #ffffff; }
      #architecture-layers-root .h-subtitle { font-family: var(--font-sans); font-size: 10px; fill: #e7eee5; }
      #architecture-layers-root .h-name { font-family: var(--font-sans); font-size: 13px; font-weight: 700; fill: #465842; }
      #architecture-layers-root .h-note { font-family: var(--font-sans); font-size: 10px; fill: #687664; }
      #architecture-layers-root .diagram-container { overflow-x: visible; }</style>
        <linearGradient id="architecture-layers-header-gradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2d3142"/>
          <stop offset="1" stop-color="#4f5d75"/>
        </linearGradient>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Connectors are drawn before the layer cards. -->
      <g fill="#959dac">
        <path d="M568 172 L580 172 L574 181 Z"/>
        <path d="M568 252 L580 252 L574 261 Z"/>
        <path d="M568 332 L580 332 L574 341 Z"/>
        <path d="M568 412 L580 412 L574 421 Z"/>
        <path d="M568 492 L580 492 L574 501 Z"/>
        <path d="M568 572 L580 572 L574 581 Z"/>
      </g>

      <rect x="24" y="20" width="1232" height="64" rx="8" fill="url(#architecture-layers-header-gradient)"/>
      <text class="title" x="48" y="58">智能客服系统 · 分层架构</text>
      <text class="subtitle" x="1232" y="57" text-anchor="end">七层主链路 + Harness：每层负责什么，代码从哪里找</text>

      <!-- Layer 1 -->
      <rect x="24" y="100" width="140" height="72" rx="8" fill="#4f5d75"/>
      <text class="layer-name" x="94" y="130" text-anchor="middle">交互</text>
      <text class="layer-tech" x="94" y="150" text-anchor="middle">Vue / SSE</text>
      <rect x="176" y="100" width="820" height="72" rx="8" fill="#f0f2f5" stroke="#c4c9d1"/>
      <text class="row-title" x="196" y="124">客户咨询与坐席工作台</text>
      <text class="code-path" x="976" y="123" text-anchor="end">frontend/workbench/src/*.vue</text>
      <g color="#3f4a5d">
        <rect x="196" y="138" width="92" height="22" rx="6" fill="#ffffff" stroke="#c4c9d1"/>
        <text class="chip-text" x="242" y="153" text-anchor="middle">客户咨询</text>
        <rect x="296" y="138" width="92" height="22" rx="6" fill="#ffffff" stroke="#c4c9d1"/>
        <text class="chip-text" x="342" y="153" text-anchor="middle">坐席审核</text>
        <rect x="396" y="138" width="116" height="22" rx="6" fill="#ffffff" stroke="#c4c9d1"/>
        <text class="chip-text" x="454" y="153" text-anchor="middle">会话与业务资料</text>
        <rect x="520" y="138" width="92" height="22" rx="6" fill="#ffffff" stroke="#c4c9d1"/>
        <text class="chip-text" x="566" y="153" text-anchor="middle">实时消息</text>
        <rect x="620" y="138" width="112" height="22" rx="6" fill="#ffffff" stroke="#c4c9d1"/>
        <text class="chip-text" x="676" y="153" text-anchor="middle">模型选择展示</text>
      </g>

      <!-- Layer 2 -->
      <rect x="24" y="180" width="140" height="72" rx="8" fill="#2e5aa8"/>
      <text class="layer-name" x="94" y="210" text-anchor="middle">接口</text>
      <text class="layer-tech" x="94" y="230" text-anchor="middle">Nginx / BFF</text>
      <rect x="176" y="180" width="820" height="72" rx="8" fill="#eef3fb" stroke="#abc0e2"/>
      <text class="row-title" x="196" y="204">统一入口、鉴权、消息与恢复</text>
      <text class="code-path" x="976" y="203" text-anchor="end">services/bff/ · infra/docker/</text>
      <g color="#264b86">
        <rect x="196" y="218" width="90" height="22" rx="6" fill="#ffffff" stroke="#abc0e2"/>
        <text class="chip-text" x="241" y="233" text-anchor="middle">JWT / RBAC</text>
        <rect x="294" y="218" width="102" height="22" rx="6" fill="#ffffff" stroke="#abc0e2"/>
        <text class="chip-text" x="345" y="233" text-anchor="middle">对象级授权</text>
        <rect x="404" y="218" width="92" height="22" rx="6" fill="#ffffff" stroke="#abc0e2"/>
        <text class="chip-text" x="450" y="233" text-anchor="middle">幂等受理</text>
        <rect x="504" y="218" width="92" height="22" rx="6" fill="#ffffff" stroke="#abc0e2"/>
        <text class="chip-text" x="550" y="233" text-anchor="middle">消息落库</text>
        <rect x="604" y="218" width="112" height="22" rx="6" fill="#ffffff" stroke="#abc0e2"/>
        <text class="chip-text" x="660" y="233" text-anchor="middle">SSE 与断线恢复</text>
      </g>

      <!-- Layer 3: focal -->
      <rect x="24" y="260" width="140" height="72" rx="8" fill="#bf4520"/>
      <text class="layer-name" x="94" y="290" text-anchor="middle">编排</text>
      <text class="layer-tech" x="94" y="310" text-anchor="middle">LangGraph</text>
      <rect x="176" y="260" width="820" height="72" rx="8" fill="#f8ece8" stroke="#dfb3a4" stroke-width="1.2"/>
      <text class="row-title" x="196" y="284">本轮上下文、路由与状态恢复</text>
      <text class="code-path" x="976" y="283" text-anchor="end">services/ai_runtime/{graph,query,intent,decision}/</text>
      <g color="#943519">
        <rect x="196" y="298" width="92" height="22" rx="6" fill="#ffffff" stroke="#dfb3a4"/>
        <text class="focal-chip-text" x="242" y="313" text-anchor="middle">Graph State</text>
        <rect x="296" y="298" width="98" height="22" rx="6" fill="#ffffff" stroke="#dfb3a4"/>
        <text class="focal-chip-text" x="345" y="313" text-anchor="middle">Query 处理</text>
        <rect x="402" y="298" width="102" height="22" rx="6" fill="#ffffff" stroke="#dfb3a4"/>
        <text class="focal-chip-text" x="453" y="313" text-anchor="middle">全局意图</text>
        <rect x="512" y="298" width="102" height="22" rx="6" fill="#ffffff" stroke="#dfb3a4"/>
        <text class="focal-chip-text" x="563" y="313" text-anchor="middle">澄清恢复</text>
        <rect x="622" y="298" width="114" height="22" rx="6" fill="#ffffff" stroke="#dfb3a4"/>
        <text class="focal-chip-text" x="679" y="313" text-anchor="middle">终态契约</text>
      </g>

      <!-- Layer 4 -->
      <rect x="24" y="340" width="140" height="72" rx="8" fill="#536f5a"/>
      <text class="layer-name" x="94" y="370" text-anchor="middle">业务</text>
      <text class="layer-tech" x="94" y="390" text-anchor="middle">FAQ / SOP / RAG</text>
      <rect x="176" y="340" width="820" height="72" rx="8" fill="#eff5f0" stroke="#b6c7b8"/>
      <text class="row-title" x="196" y="364">自动问答、流程办理与人工审核</text>
      <text class="code-path" x="976" y="363" text-anchor="end">services/ai_runtime/{retrieval,sop,generation}/</text>
      <g color="#405a47">
        <rect x="196" y="378" width="92" height="22" rx="6" fill="#ffffff" stroke="#b6c7b8"/>
        <text class="chip-text" x="242" y="393" text-anchor="middle">FAQ 选择</text>
        <rect x="296" y="378" width="104" height="22" rx="6" fill="#ffffff" stroke="#b6c7b8"/>
        <text class="chip-text" x="348" y="393" text-anchor="middle">SOP 填槽</text>
        <rect x="408" y="378" width="120" height="22" rx="6" fill="#ffffff" stroke="#b6c7b8"/>
        <text class="chip-text" x="468" y="393" text-anchor="middle">业务事实查询</text>
        <rect x="536" y="378" width="116" height="22" rx="6" fill="#ffffff" stroke="#b6c7b8"/>
        <text class="chip-text" x="594" y="393" text-anchor="middle">RAG 草稿</text>
        <rect x="660" y="378" width="116" height="22" rx="6" fill="#ffffff" stroke="#b6c7b8"/>
        <text class="chip-text" x="718" y="393" text-anchor="middle">坐席审核</text>
      </g>

      <!-- Layer 5 -->
      <rect x="24" y="420" width="140" height="72" rx="8" fill="#596f8c"/>
      <text class="layer-name" x="94" y="450" text-anchor="middle">内容检索</text>
      <text class="layer-tech" x="94" y="470" text-anchor="middle">Content / Retrieval</text>
      <rect x="176" y="420" width="820" height="72" rx="8" fill="#f0f3f7" stroke="#bbc6d3"/>
      <text class="row-title" x="196" y="444">发布快照、精确映射与语义检索</text>
      <text class="code-path" x="976" y="443" text-anchor="end">services/content/ · ai_runtime/retrieval/</text>
      <g color="#425773">
        <rect x="196" y="458" width="98" height="22" rx="6" fill="#ffffff" stroke="#bbc6d3"/>
        <text class="chip-text" x="245" y="473" text-anchor="middle">内容发布</text>
        <rect x="302" y="458" width="110" height="22" rx="6" fill="#ffffff" stroke="#bbc6d3"/>
        <text class="chip-text" x="357" y="473" text-anchor="middle">Redis 精确映射</text>
        <rect x="420" y="458" width="110" height="22" rx="6" fill="#ffffff" stroke="#bbc6d3"/>
        <text class="chip-text" x="475" y="473" text-anchor="middle">Milvus 语义</text>
        <rect x="538" y="458" width="128" height="22" rx="6" fill="#ffffff" stroke="#bbc6d3"/>
        <text class="chip-text" x="602" y="473" text-anchor="middle">Dense + BM25</text>
        <rect x="674" y="458" width="104" height="22" rx="6" fill="#ffffff" stroke="#bbc6d3"/>
        <text class="chip-text" x="726" y="473" text-anchor="middle">融合与精排</text>
      </g>

      <!-- Layer 6 -->
      <rect x="24" y="500" width="140" height="72" rx="8" fill="#94543f"/>
      <text class="layer-name" x="94" y="530" text-anchor="middle">模型</text>
      <text class="layer-tech" x="94" y="550" text-anchor="middle">Provider</text>
      <rect x="176" y="500" width="820" height="72" rx="8" fill="#f7efec" stroke="#d4b7ad"/>
      <text class="row-title" x="196" y="524">语言理解、向量编码、精排与旁路观测</text>
      <text class="code-path" x="976" y="523" text-anchor="end">model_request.py · decision/jev.py · prompts/</text>
      <g color="#763e2e">
        <rect x="196" y="538" width="102" height="22" rx="6" fill="#ffffff" stroke="#d4b7ad"/>
        <text class="chip-text" x="247" y="553" text-anchor="middle">主 LLM</text>
        <rect x="306" y="538" width="116" height="22" rx="6" fill="#ffffff" stroke="#d4b7ad"/>
        <text class="chip-text" x="364" y="553" text-anchor="middle">Qwen Embedding</text>
        <rect x="430" y="538" width="126" height="22" rx="6" fill="#ffffff" stroke="#d4b7ad"/>
        <text class="chip-text" x="493" y="553" text-anchor="middle">云端 Reranker</text>
        <rect x="564" y="538" width="122" height="22" rx="6" fill="#ffffff" stroke="#d4b7ad"/>
        <text class="chip-text" x="625" y="553" text-anchor="middle">Jev 旁路对比</text>
      </g>

      <!-- Layer 7 -->
      <rect x="24" y="580" width="140" height="72" rx="8" fill="#2d3142"/>
      <text class="layer-name" x="94" y="610" text-anchor="middle">数据</text>
      <text class="layer-tech" x="94" y="630" text-anchor="middle">State / Storage</text>
      <rect x="176" y="580" width="820" height="72" rx="8" fill="#f0f0f2" stroke="#bfc0c7"/>
      <text class="row-title" x="196" y="604">业务事实、内容版本、投影与检查点</text>
      <text class="code-path" x="976" y="603" text-anchor="end">infra/db/migrations/ · ai_runtime/persistence/</text>
      <g color="#2d3142">
        <rect x="196" y="618" width="112" height="22" rx="6" fill="#ffffff" stroke="#bfc0c7"/>
        <text class="chip-text" x="252" y="633" text-anchor="middle">PostgreSQL</text>
        <rect x="316" y="618" width="92" height="22" rx="6" fill="#ffffff" stroke="#bfc0c7"/>
        <text class="chip-text" x="362" y="633" text-anchor="middle">Redis</text>
        <rect x="416" y="618" width="92" height="22" rx="6" fill="#ffffff" stroke="#bfc0c7"/>
        <text class="chip-text" x="462" y="633" text-anchor="middle">Milvus</text>
        <rect x="516" y="618" width="132" height="22" rx="6" fill="#ffffff" stroke="#bfc0c7"/>
        <text class="chip-text" x="582" y="633" text-anchor="middle">LangGraph Checkpoint</text>
        <rect x="656" y="618" width="122" height="22" rx="6" fill="#ffffff" stroke="#bfc0c7"/>
        <text class="chip-text" x="717" y="633" text-anchor="middle">运行产物引用</text>
      </g>

      <!-- Cross-cutting harness -->
      <rect x="1012" y="100" width="244" height="552" rx="8" fill="#eff5f0" stroke="#9ab09e" stroke-width="1.2"/>
      <rect x="1012" y="100" width="244" height="56" rx="8" fill="#536f5a"/>
      <path d="M1012 148 H1256 V156 H1012 Z" fill="#536f5a"/>
      <text class="h-title" x="1134" y="126" text-anchor="middle">Harness</text>
      <text class="h-subtitle" x="1134" y="144" text-anchor="middle">贯穿全程的约束、审计与恢复</text>

      <g>
        <text class="h-name" x="1036" y="184">身份与对象权限</text>
        <text class="h-note" x="1036" y="202">JWT、角色、会话和业务对象授权</text>
        <line x1="1036" y1="218" x2="1232" y2="218" stroke="#c9d5c7"/>

        <text class="h-name" x="1036" y="244">安全护栏与输出门</text>
        <text class="h-note" x="1036" y="262">高风险拦截、证据约束、客户可见放行</text>
        <line x1="1036" y1="278" x2="1232" y2="278" stroke="#c9d5c7"/>

        <text class="h-name" x="1036" y="304">幂等与并发控制</text>
        <text class="h-note" x="1036" y="322">消息、审核、业务操作防止重复执行</text>
        <line x1="1036" y1="338" x2="1232" y2="338" stroke="#c9d5c7"/>

        <text class="h-name" x="1036" y="364">超时、降级与安全退出</text>
        <text class="h-note" x="1036" y="382">依赖异常不伪造结果，不静默误答</text>
        <line x1="1036" y1="398" x2="1232" y2="398" stroke="#c9d5c7"/>

        <text class="h-name" x="1036" y="424">Trace、审计与质量记录</text>
        <text class="h-note" x="1036" y="442">记录路径、版本、耗时、证据和操作者</text>
        <line x1="1036" y1="458" x2="1232" y2="458" stroke="#c9d5c7"/>

        <text class="h-name" x="1036" y="484">审核、发布与成套回退</text>
        <text class="h-note" x="1036" y="502">候选先验证，活动版本可追溯可恢复</text>
        <line x1="1036" y1="518" x2="1232" y2="518" stroke="#c9d5c7"/>

        <text class="h-name" x="1036" y="544">健康检查与故障恢复</text>
        <text class="h-note" x="1036" y="562">Run、Checkpoint、SSE 与依赖就绪状态</text>
      </g>

      <text class="footer" x="24" y="690">阅读方式：主链路自上而下；右侧治理机制同时约束多层，不是流程末尾才执行的一步。</text>
      <text class="footer" x="1256" y="690" text-anchor="end">当前一期运行基线</text>
    </svg>
