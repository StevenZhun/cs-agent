[project]
name = "cs-agent"
version = "0.1.0"
description = "AI-assisted customer-service project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.8.0,<2",
    "langchain-typesafe==0.1.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "pymilvus>=2.6,<3",
    "redis>=5,<7",
    "sentence-transformers>=5,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
