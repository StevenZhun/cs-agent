events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2m;

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
    limit_req_status 429;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Compose 重建 BFF 后容器地址可能变化。使用 Docker 内置 DNS 动态刷新
    # upstream，避免 Nginx 继续访问启动时解析到的旧地址并持续返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream bff_backend {
        zone bff_backend 64k;
        server bff:8000 resolve;
    }

    server {
        listen 80;
        server_name localhost;
        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 308 https://$host:8443$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/localhost.crt;
        ssl_certificate_key /etc/nginx/tls/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            limit_req zone=api_rate burst=40 nodelay;
            proxy_pass http://bff_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Trace-ID $http_x_trace_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # 带内容哈希的静态资源文件名会随构建变化，可以长期缓存。
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 页面入口必须重新确认，否则浏览器可能继续引用上一次构建的资源。
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
